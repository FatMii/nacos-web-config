name: Publish GitHub Packages

# Fills the repo Packages tab. Canonical installs stay on Maven Central / npmjs;
# this job mirrors the same 0.1.x artifacts into GitHub Package Registry.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maven:
    name: Maven → GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Deploy reactor modules
        working-directory: java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn --batch-mode --no-transfer-progress
          -DskipTests
          -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
          deploy

  npm:
    name: npm → GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@fatmii'
      - name: Install and build
        working-directory: browser
        run: |
          npm ci
          npm run build
      - name: Publish @fatmii/nacos-web-config
        working-directory: browser
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg delete private --workspace @fatmii/nacos-web-config
          npm publish --workspace @fatmii/nacos-web-config --access public
