name: nacos-web-config-local
services:
  nacos2:
    image: nacos/nacos-server:v2.5.3@sha256:8b7238182c980e84da290882e74cf7366677c5eb82d748a89c3ae9d998747ed9
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: 'false'
      NACOS_AUTH_TOKEN: ${NACOS_TEST_TOKEN:-VGhpc0lzT25seUZvckxvY2FsTmFjb3NQb2NUZXN0aW5n}
      NACOS_AUTH_IDENTITY_KEY: nwcIdentity
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_TEST_IDENTITY:-localIdentityValue}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - '127.0.0.1:18848:8848'
      - '127.0.0.1:19848:9848'
    volumes:
      - nacos2-data:/home/nacos/data
      - nacos2-logs:/home/nacos/logs
  nacos3:
    image: nacos/nacos-server:v3.2.3@sha256:f1aeb4713ac965dd053f0e936c2ca855af6ccf2a77199d40580b9ba583962c8f
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: 'false'
      NACOS_AUTH_ADMIN_ENABLE: 'true'
      NACOS_AUTH_CONSOLE_ENABLE: 'true'
      NACOS_AUTH_TOKEN: ${NACOS_TEST_TOKEN:-VGhpc0lzT25seUZvckxvY2FsTmFjb3NQb2NUZXN0aW5n}
      NACOS_AUTH_IDENTITY_KEY: nwcIdentity
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_TEST_IDENTITY:-localIdentityValue}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - '127.0.0.1:28848:8848'
      - '127.0.0.1:29848:9848'
      - '127.0.0.1:28080:8080'
    volumes:
      - nacos3-data:/home/nacos/data
      - nacos3-logs:/home/nacos/logs
  proxy:
    profiles: [proxy]
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    ports:
      - '127.0.0.1:18081:8081'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
volumes:
  nacos2-data:
  nacos2-logs:
  nacos3-data:
  nacos3-logs:
