worker_processes 1;

events {
    worker_connections 128;
}

http {
    access_log off;

    server {
        listen 8081;

        location / {
            proxy_pass http://host.docker.internal:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_pass_header X-Accel-Buffering;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 30s;
        }
    }
}
