# CI overlay for nacos-web-config E2E.
# Restates the nacos3 admin-auth switches that compose.yaml already enables, so CI keeps them on
# even if a local run turns them off; the admin token helper only works when admin auth is on.
#
# Usage:
#   docker compose -f compose.yaml -f compose.ci.yaml --project-name nacos-web-config-ci up -d nacos2
#   docker compose -f compose.yaml -f compose.ci.yaml --project-name nacos-web-config-ci up -d nacos3
#   docker compose -f compose.yaml -f compose.ci.yaml --project-name nacos-web-config-ci --profile proxy up -d proxy
services:
  nacos3:
    environment:
      # Admin auth stays on (realistic). Console auth stays on.
      # Identity values match compose.yaml defaults for local client reuse.
      NACOS_AUTH_ADMIN_ENABLE: 'true'
      NACOS_AUTH_CONSOLE_ENABLE: 'true'
