<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nacos Web Config Browser E2E</title>
  </head>
  <body data-status="loading">
    <main>
      <h1 id="banner">fallback</h1>
      <p id="status">loading</p>
    </main>
    <script type="module">
      import { createWebConfig } from '/__nwc_e2e__/sdk.js'

      const banner = document.querySelector('#banner')
      const status = document.querySelector('#status')
      const client = createWebConfig({
        endpoint: '/_web-config/v1/stream',
        definitions: {
          ui: {
            fallback: { banner: { enabled: true, text: 'fallback' }, refreshIntervalMs: 30_000 },
            decode: decodeUi,
          },
        },
        onError(error) {
          document.body.dataset.error = error.code
        },
      })

      client.subscribe('ui', state => {
        document.body.dataset.status = state.status
        banner.textContent = state.value.banner.enabled ? state.value.banner.text : 'fallback'
        status.textContent = `${state.status}${state.stale ? ' (stale)' : ''}`
      })

      window.addEventListener('pagehide', () => client.close(), { once: true })

      function decodeUi(value) {
        if (typeof value !== 'object' || value === null || Array.isArray(value)) throw new Error('ui must be an object')
        const candidate = value
        if (typeof candidate.banner !== 'object' || candidate.banner === null || Array.isArray(candidate.banner)
            || typeof candidate.banner.enabled !== 'boolean'
            || typeof candidate.banner.text !== 'string'
            || !Number.isInteger(candidate.refreshIntervalMs)) throw new Error('invalid ui config')
        return {
          banner: { enabled: candidate.banner.enabled, text: candidate.banner.text },
          refreshIntervalMs: candidate.refreshIntervalMs,
        }
      }
    </script>
  </body>
</html>
