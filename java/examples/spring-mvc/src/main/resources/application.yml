nacos-web-config:
  enabled: true
  access: public
  nacos:
    server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
  exposures:
    ui:
      group: WEB_DEMO
      data-id: web-demo.public.json
      max-bytes: 65536

management:
  endpoints:
    web:
      # Example only: /actuator/metrics lets you watch the nacos.webconfig.* counters move while a
      # browser is connected. A production host decides its own exposure policy.
      exposure:
        include: health,metrics
  endpoint:
    health:
      # Boot hides health details by default, and so hides our per-key states with them.
      show-details: always
